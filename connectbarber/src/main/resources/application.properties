spring.application.name=connectbarber

# O Render atribui a porta dinamicamente através da variável PORT. Se não existir (local), usa a 8080.
server.port=${PORT:8080}

# Configuração da Base de Dados (Utiliza PostgreSQL no Render)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:barberdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# Configurações do Hibernate/JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Console H2 (Apenas ativo se estiver em ambiente local/H2)
spring.h2.console.enabled=true
